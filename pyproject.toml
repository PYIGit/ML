[project]
name = "ml"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "pandas>=3.1.0",
    "polars>=2.1.0",
    "pyarrow>=26.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ml"]

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "matplotlib>=3.11.2",
    "pytest>=9.2.0",
]
